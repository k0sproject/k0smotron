apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  annotations:
    cert-manager.io/inject-ca-from: k0smotron/k0smotron-serving-cert
  labels:
    cluster.x-k8s.io/provider: k0sproject-k0smotron
  name: k0smotron-mutating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: k0smotron-webhook-service
      namespace: k0smotron
      path: /mutate-bootstrap-cluster-x-k8s-io-v1beta2-k0sworkerconfig
  failurePolicy: Fail
  name: mutate-k0sworkerconfig-v1beta2.k0smotron.io
  rules:
  - apiGroups:
    - bootstrap.cluster.x-k8s.io
    apiVersions:
    - v1beta2
    operations:
    - CREATE
    - UPDATE
    resources:
    - k0sworkerconfigs
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: k0smotron-webhook-service
      namespace: k0smotron
      path: /mutate-controlplane-cluster-x-k8s-io-v1beta2-k0scontrolplane
  failurePolicy: Fail
  name: mutate-k0scontrolplane-v1beta2.k0smotron.io
  rules:
  - apiGroups:
    - controlplane.cluster.x-k8s.io
    apiVersions:
    - v1beta2
    operations:
    - CREATE
    - UPDATE
    resources:
    - k0scontrolplanes
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: k0smotron-webhook-service
      namespace: k0smotron
      path: /mutate-k0smotron-io-v1beta2-cluster
  failurePolicy: Fail
  name: mutate-k0smotron-cluster-v1beta2.k0smotron.io
  rules:
  - apiGroups:
    - k0smotron.io
    apiVersions:
    - v1beta2
    operations:
    - CREATE
    - UPDATE
    resources:
    - clusters
  sideEffects: None
