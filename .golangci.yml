version: "2"
run:
  build-tags:
    - hack
  modules-download-mode: readonly
  tests: true
  allow-parallel-runners: true
linters:
  default: none
  enable:
    - forbidigo
    - goheader
    - revive
    - modernize
    - govet
    - recvcheck
    - errchkjson
    - exhaustive
    - errcheck
    - errorlint
    - testifylint
    - noctx
    - nilerr
    - contextcheck
    - gosec
    - staticcheck
    - ineffassign
    - wastedassign
    - unused
    - unparam
    - gocritic
    - forcetypeassert
    - usestdlibvars
    - misspell
    - mirror
    - intrange
    - dupword
    - thelper
    - nilnil
    - unconvert
  settings:
    forbidigo:
      analyze-types: false
      forbid:
        - pattern: "^scope\\.client\\.(Create|Patch|Update)$"
          msg: >-
            Direct scope.client mutation call detected.
            Use scope.reconcileResource() to ensure user-defined component patches are applied.
            If this call is intentionally exempt, add //nolint:forbidigo with a justification comment.
    depguard:
      rules:
        main:
          files:
            - $all
            - "!internal/controller/k0smotron.io/k0smotroncluster_kubeconfig.go"
            - "!internal/controller/k0smotron.io/k0smotroncluster_kubeconfig_test.go"
          deny:
            - pkg: k8s.io/client-go/tools/clientcmd
              desc: clientcmd is only allowed in specific files
            - pkg: k8s.io/client-go/tools/clientcmd/api
              desc: clientcmd is only allowed in specific files
            - pkg: k8s.io/client-go/tools/clientcmd/api/latest
              desc: clientcmd is only allowed in specific files
    exhaustive:
      default-signifies-exhaustive: true
    gosec:
      severity: medium
      confidence: medium
    gocritic:
      # Bug-finding (diagnostic) checks only.
      enabled-tags:
        - diagnostic
      disabled-tags:
        - style
        - performance
    misspell:
      locale: US
    govet:
      enable-all: true
      disable:
        - shadow
        - fieldalignment
    staticcheck:
      # The SA checks without their performance group (SA6). Stylecheck (ST),
      # quickfix (QF) and simplification (S1) checks are left out.
      checks:
        - SA*
        - -SA6*
    revive:
      rules:
        # The following rules are recommended https://github.com/mgechev/revive#recommended-configuration
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
        - name: if-return
        - name: increment-decrement
        - name: var-naming
        - name: var-declaration
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unused-parameter
        - name: unreachable-code
        - name: redefines-builtin-id
        - name: defer
        - name: modifies-value-receiver
        - name: deep-exit
        - name: unchecked-type-assertion
          arguments:
            - acceptIgnoredAssertionResult: true
  exclusions:
    generated: strict
    rules:
      - linters: [revive]
        text: "var-naming: avoid meaningless package names"
        path: "(internal/controller/util/|inttest/util/)"
      # The OrDie setup helpers in main.go exit on failure by design, and the e2e
      # setup can only parse its flags once go test has registered its own.
      - linters: [revive]
        text: "deep-exit:"
        path: "^(cmd/main|e2e/setup)\\.go$"
      # Integration test polls return (false, nil) on an error to retry until
      # the poll times out, which is the wait.Poll contract.
      - linters: [nilerr]
        path: "^inttest/"
      # Tests drive kubectl, docker and sh with arguments they build themselves.
      # These deprecations need their own migration: typed server-side apply,
      # the events.k8s.io recorder, and exported API constants.
      - linters: [staticcheck]
        text: "SA1019: (sigs.k8s.io/controller-runtime/pkg/client.Apply|\\(sigs.k8s.io/controller-runtime/pkg/manager.Manager\\).GetEventRecorderFor|sigs.k8s.io/cluster-api/api/core/v1beta2.ConditionType) is deprecated"
      - linters: [gosec]
        text: "G204:"
        path: "(^inttest/|_test\\.go$)"
    paths:
      # Ignore issues in generated files.
      - zz_generated.*\.go$
formatters:
  enable:
    - gofmt
  exclusions:
    generated: strict
    paths:
      - zz_generated.*\.go$
