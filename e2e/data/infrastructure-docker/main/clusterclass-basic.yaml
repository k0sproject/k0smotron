apiVersion: cluster.x-k8s.io/v1beta2
kind: ClusterClass
metadata:
  name: basic
  namespace: ${NAMESPACE}
spec:
  upgrade:
    external:
      generateUpgradePlanExtension: generate-upgrade-plan.chain-upgrades-extensionconfig
  controlPlane:
    templateRef:
      apiVersion: controlplane.cluster.x-k8s.io/v1beta2
      kind: K0sControlPlaneTemplate
      name: ${CLUSTER_NAME}-control-plane
    machineInfrastructure:
      templateRef:
        kind: DevMachineTemplate
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
        name: ${CLUSTER_NAME}-machine-template
  infrastructure:
    templateRef:
      apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
      kind: DevClusterTemplate
      name: ${CLUSTER_NAME}-docker-cluster-tmpl
---
apiVersion: controlplane.cluster.x-k8s.io/v1beta2
kind: K0sControlPlaneTemplate
metadata:
  name: ${CLUSTER_NAME}-control-plane
  namespace: ${NAMESPACE}
spec:
  template:
    spec:
      updateStrategy: Recreate
      k0sConfigSpec:
        k0s:
          apiVersion: k0s.k0sproject.io/v1beta1
          kind: ClusterConfig
          metadata:
            name: k0s
          spec:
            api:
              extraArgs:
                anonymous-auth: "true"
            telemetry:
              enabled: false
        args:
        - --enable-worker
        - --no-taints
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: DevMachineTemplate
metadata:
  name: ${CLUSTER_NAME}-machine-template
  namespace: ${NAMESPACE}
spec:
  template:
    spec:
      backend:
        docker:
          customImage: kindest/node:v1.31.0
---
apiVersion: v1
data:
  value: |
    # generated by kind
    global
      log /dev/log local0
      log /dev/log local1 notice
      daemon
      # limit memory usage to approximately 18 MB
      # (see https://github.com/kubernetes-sigs/kind/pull/3115)
      maxconn 100000

    resolvers docker
      nameserver dns 127.0.0.11:53

    defaults
      log global
      mode tcp
      option dontlognull
      # TODO: tune these
      timeout connect 5000
      timeout client 50000
      timeout server 50000
      # allow to boot despite dns don't resolve backends
      default-server init-addr none

    frontend stats
      mode http
      bind *:8404
      stats enable
      stats uri /stats
      stats refresh 1s
      stats admin if TRUE

    frontend control-plane
      bind *:{{ .FrontendControlPlanePort }}
      {{ if .IPv6 -}}
      bind :::{{ .FrontendControlPlanePort }};
      {{- end }}
      default_backend kube-apiservers

    backend kube-apiservers
      default-server inter 2s fall 2 rise 3
      timeout connect 2s
      timeout server 5s
      retries 3
      option redispatch
      option httpchk GET /healthz
      {{range $server, $backend := .BackendServers}}
      server {{ $server }} {{ JoinHostPort $backend.Address $.BackendControlPlanePort }} weight {{ $backend.Weight }} check check-ssl verify none resolvers docker resolve-prefer {{ if $.IPv6 -}} ipv6 {{- else -}} ipv4 {{- end }}
      {{- end}}
kind: ConfigMap
metadata:
  name: ha-proxy-config
  namespace: ${NAMESPACE}
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: DevClusterTemplate
metadata:
  name: ${CLUSTER_NAME}-docker-cluster-tmpl
  namespace: ${NAMESPACE}
spec:
  template:
    spec:
      backend:
        docker:
          loadBalancer:
            customHAProxyConfigTemplateRef:
              name: ha-proxy-config