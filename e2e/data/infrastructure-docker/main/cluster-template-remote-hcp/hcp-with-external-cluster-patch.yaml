apiVersion: controlplane.cluster.x-k8s.io/v1beta1
kind: K0smotronControlPlane
metadata:
  name: ${CLUSTER_NAME}-docker-test
  namespace: ${NAMESPACE}
spec:
  remoteHostCluster:
    syncReferencedObjects: true
    kubeconfigRef:
      name: hosting-cluster-kubeconfig
      namespace: ${NAMESPACE}
      key: value
  # sync-test only exists in the management cluster, it is synced to the hosting cluster.
  mounts:
    - path: /mnt/sync-test
      secret:
        secretName: sync-test
  replicas: ${CONTROL_PLANE_MACHINE_COUNT}
  version: v1.30.1-k0s.0
  service:
    type: NodePort
    apiPort: 31443

  k0sConfig:
    apiVersion: k0s.k0sproject.io/v1beta1
    kind: ClusterConfig
    spec:
      telemetry:
        enabled: false
