apiVersion: cluster.x-k8s.io/v1beta1
kind: Cluster
metadata:
  name: ${CLUSTER_NAME}
  namespace: ${NAMESPACE}
spec:
  clusterNetwork:
    pods:
      cidrBlocks:
        - 192.168.0.0/16
    serviceDomain: cluster.local
    services:
      cidrBlocks:
        - 10.128.0.0/12
  controlPlaneRef:
    apiVersion: controlplane.cluster.x-k8s.io/v1beta1
    kind: K0smotronControlPlane
    name: ${CLUSTER_NAME}-cp
  infrastructureRef:
    apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
    kind: AWSCluster
    name: ${CLUSTER_NAME}
---
# Hosted control plane. It does NOT run in the kind management cluster: it is
# deployed into the AWS hosting cluster created by the "windows-ingress-host"
# flavor (see remoteHostCluster below), and the AWS workers reach it through
# that cluster's HAProxy ingress front door using nip.io hostnames built from
# the hosting cluster node's public IPv4.
apiVersion: controlplane.cluster.x-k8s.io/v1beta2
kind: K0smotronControlPlane
metadata:
  name: ${CLUSTER_NAME}-cp
  namespace: ${NAMESPACE}
spec:
  version: ${KUBERNETES_VERSION}
  # Deploy the control plane pods into the AWS hosting cluster instead of the
  # management cluster. ${HOST_CLUSTER_KUBECONFIG_SECRET} is the CAPI-generated
  # kubeconfig Secret of that cluster ("<hosting cluster name>-kubeconfig"),
  # which lives in this same namespace of the management cluster.
  remoteHostCluster:
    kubeconfigRef:
      name: ${HOST_CLUSTER_KUBECONFIG_SECRET}
      namespace: ${NAMESPACE}
      key: value
  # kine/sqlite on an emptyDir keeps the hosting cluster free of any
  # StorageClass requirement: the default etcd backend would need a PVC, and a
  # plain k0s cluster on EC2 ships no dynamic provisioner (k0s's
  # openebs_local_storage extension has been a no-op since k0s 1.31). The
  # storage backend is irrelevant to what this spec asserts (ingress + Windows
  # node-local proxy), so the cheapest one that needs no volumes is used.
  #
  # dataSourceURL must be set explicitly: k0s only fills in its default kine
  # DSN when the whole "kine" section is absent, and k0smotron always emits it,
  # so an empty value would make the control plane fail with "unsupported kine
  # data source". The value below is exactly k0s's own default, resolved against
  # the control plane pod's data dir (/var/lib/k0s, the persistence mount).
  storage:
    type: kine
    kine:
      dataSourceURL: sqlite://file:/var/lib/k0s/db/state.db?mode=rwc&_journal=WAL
  persistence:
    type: emptyDir
  service:
    type: NodePort
  ingress:
    # ${HOST_IP} is the hosting cluster node's PUBLIC IPv4, read from that
    # cluster's control plane Machine by e2e/windows_ingress_test.go. The public
    # address is used (rather than the private one) so that the same hostname
    # works both for the same-VPC workers and for the test process, which talks
    # to the workload cluster's API through this very ingress.
    apiHost: kube-api.${HOST_IP}.nip.io
    konnectivityHost: konnectivity.${HOST_IP}.nip.io
    # ${INGRESS_PORT} is the NodePort the HAProxy ingress controller is exposed
    # on in the hosting cluster (see e2e/data/haproxy-ingress.yaml); the
    # hosting cluster's AWSCluster opens the same port on its control plane
    # security group.
    port: ${INGRESS_PORT}
    annotations:
      haproxy.org/ssl-passthrough: "true"
  k0sConfig:
    apiVersion: k0s.k0sproject.io/v1beta1
    kind: ClusterConfig
    spec:
      api:
        extraArgs:
          anonymous-auth: "true"
      network:
        # Windows nodes require Calico (kube-router, the k0s default, does not
        # support Windows).
        provider: calico
      telemetry:
        enabled: false
---
# AWSCluster is annotated as externally managed because there is no
# CAPA-managed control plane machine (the control plane is hosted, see above).
# ${AWS_VPC_ID}/${AWS_SUBNET_ID}/${AWS_AVAILABILITY_ZONE} are the hosting
# cluster's own VPC / public subnet / AZ, read from its AWSCluster by
# e2e/windows_ingress_test.go, so the workers land next to the hosting node.
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: AWSCluster
metadata:
  name: ${CLUSTER_NAME}
  namespace: ${NAMESPACE}
  annotations:
    cluster.x-k8s.io/managed-by: k0smotron
spec:
  region: eu-west-1
  sshKeyName: ${SSH_KEY_NAME}
  network:
    vpc:
      id: ${AWS_VPC_ID}
    subnets:
      - id: ${AWS_SUBNET_ID}
        availabilityZone: ${AWS_AVAILABILITY_ZONE}
        isPublic: true
---
# Windows worker pool -- this is what exercises the k0smotron-proxy-win
# HostProcess DaemonSet.
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: AWSMachineTemplate
metadata:
  name: ${CLUSTER_NAME}-mt-worker-windows
  namespace: ${NAMESPACE}
spec:
  template:
    spec:
      publicIP: true
      # Pin to the hosting cluster's public subnet so the worker sits in the
      # same VPC/AZ as the hosting node and can reach ${HOST_IP}.
      subnet:
        id: ${AWS_SUBNET_ID}
      # For an externally managed AWSCluster, CAPA does not create security
      # groups, and additionalSecurityGroups is the ONLY source of security
      # groups it applies to the instance (see GetCoreSecurityGroups in
      # pkg/cloud/services/ec2). Reuse the hosting cluster's node security
      # group: it allows all traffic between nodes carrying it (needed for
      # Calico between the Linux and Windows workers) and all egress.
      additionalSecurityGroups:
        - id: ${AWS_NODE_SECURITY_GROUP_ID}
      ami:
        # TODO(e2e-env): Windows in eu-west-1, replace if it rotates/expires.
        id: ami-0bc74d0ac37f50b4b
      instanceType: t3.medium
      iamInstanceProfile: nodes.cluster-api-provider-aws.sigs.k8s.io
      cloudInit:
        insecureSkipSecretsManager: true
      sshKeyName: ${SSH_KEY_NAME}
---
apiVersion: cluster.x-k8s.io/v1beta1
kind: MachineDeployment
metadata:
  name: ${CLUSTER_NAME}-md-windows
  namespace: ${NAMESPACE}
spec:
  clusterName: ${CLUSTER_NAME}
  replicas: 1
  selector:
    matchLabels:
      cluster.x-k8s.io/cluster-name: ${CLUSTER_NAME}
      pool: worker-windows
  template:
    metadata:
      labels:
        cluster.x-k8s.io/cluster-name: ${CLUSTER_NAME}
        pool: worker-windows
    spec:
      clusterName: ${CLUSTER_NAME}
      bootstrap:
        configRef:
          apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
          kind: K0sWorkerConfigTemplate
          name: ${CLUSTER_NAME}-windows-config
      infrastructureRef:
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
        kind: AWSMachineTemplate
        name: ${CLUSTER_NAME}-mt-worker-windows
---
apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
kind: K0sWorkerConfigTemplate
metadata:
  name: ${CLUSTER_NAME}-windows-config
  namespace: ${NAMESPACE}
spec:
  template:
    spec:
      version: ${WORKER_K0S_VERSION}
      provisioner:
        platform: windows
        type: powershell-xml
---
# Linux worker pool -- required so CoreDNS/Calico (and the Linux flavor of the
# node-local proxy, k0smotron-proxy) have somewhere to schedule; a
# Windows-only cluster would not come up.
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: AWSMachineTemplate
metadata:
  name: ${CLUSTER_NAME}-mt-worker-linux
  namespace: ${NAMESPACE}
spec:
  template:
    spec:
      publicIP: true
      # Pin to the hosting cluster's public subnet so the worker sits in the
      # same VPC/AZ as the hosting node and can reach ${HOST_IP}.
      subnet:
        id: ${AWS_SUBNET_ID}
      # For an externally managed AWSCluster, CAPA does not create security
      # groups, and additionalSecurityGroups is the ONLY source of security
      # groups it applies to the instance (see GetCoreSecurityGroups in
      # pkg/cloud/services/ec2). Reuse the hosting cluster's node security
      # group: it allows all traffic between nodes carrying it (needed for
      # Calico between the Linux and Windows workers) and all egress.
      additionalSecurityGroups:
        - id: ${AWS_NODE_SECURITY_GROUP_ID}
      ami:
        # TODO(e2e-env): Ubuntu in eu-west-1, replace if it rotates/expires.
        id: ami-0de864d6a3bd20ea8
      instanceType: t3.large
      iamInstanceProfile: nodes.cluster-api-provider-aws.sigs.k8s.io
      cloudInit:
        insecureSkipSecretsManager: true
      sshKeyName: ${SSH_KEY_NAME}
---
apiVersion: cluster.x-k8s.io/v1beta1
kind: MachineDeployment
metadata:
  name: ${CLUSTER_NAME}-md-linux
  namespace: ${NAMESPACE}
spec:
  clusterName: ${CLUSTER_NAME}
  replicas: 1
  selector:
    matchLabels:
      cluster.x-k8s.io/cluster-name: ${CLUSTER_NAME}
      pool: worker-linux
  template:
    metadata:
      labels:
        cluster.x-k8s.io/cluster-name: ${CLUSTER_NAME}
        pool: worker-linux
    spec:
      clusterName: ${CLUSTER_NAME}
      bootstrap:
        configRef:
          apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
          kind: K0sWorkerConfigTemplate
          name: ${CLUSTER_NAME}-linux-config
      infrastructureRef:
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
        kind: AWSMachineTemplate
        name: ${CLUSTER_NAME}-mt-worker-linux
---
apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
kind: K0sWorkerConfigTemplate
metadata:
  name: ${CLUSTER_NAME}-linux-config
  namespace: ${NAMESPACE}
spec:
  template:
    spec:
      # See the note on ${WORKER_K0S_VERSION} in the Windows config above.
      version: ${WORKER_K0S_VERSION}
