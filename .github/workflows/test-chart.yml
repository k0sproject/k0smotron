name: Test Chart

on:
  workflow_dispatch:
  push:
    paths:
      - "dist/chart/**"
      - "dist/patches/**"
      - "hack/helm-crds.sh"
      - "Makefile"
      - "Makefile.variables"
      - "config/**"
      - "api/**"
      - ".github/workflows/test-chart.yml"
  pull_request:
    paths:
      - "dist/chart/**"
      - "dist/patches/**"
      - "hack/helm-crds.sh"
      - "Makefile"
      - "Makefile.variables"
      - "config/**"
      - "api/**"
      - ".github/workflows/test-chart.yml"

jobs:
  # Chart.yaml and values.yaml are the only committed pieces of dist/chart;
  # everything else is regenerated by `make helm-chart`. Catch the case where
  # config/ changed but the two tracked files were not refreshed. Runs with the
  # default IMG/CHART_VERSION, since test-e2e overrides both and would always
  # show a diff.
  chart-drift:
    name: Check committed chart files are up to date
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Generate Helm chart
        run: make helm-chart

      - name: Check for drift
        run: |
          git diff --exit-code -- dist/chart/Chart.yaml dist/chart/values.yaml \
            || { echo "::error::dist/chart/Chart.yaml or values.yaml is stale - run 'make helm-chart' and commit the result"; exit 1; }

  # Package the chart exactly as the release workflow does (`helm package`) and
  # hand the .tgz to test-e2e as an artifact, so the job under test installs the
  # same packaged artifact users pull from the OCI registry rather than a
  # working-tree directory.
  package-chart:
    name: Package chart
    runs-on: ubuntu-latest
    env:
      NAMESPACE: k0smotron-system
      IMG: k0smotron:v0.1.0
      CHART_VERSION: 0.0.0-test
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Helm
        uses: azure/setup-helm@v4

      # `make helm-chart` installs its own pinned tooling (kubebuilder, yq,
      # kustomize, controller-gen) into bin/ per Makefile.variables.
      # Pin the chart's image to the one test-e2e loads into kind.
      - name: Generate Helm chart
        run: |
          make helm-chart IMG=${IMG} CHART_VERSION=${CHART_VERSION}

      # --namespace must match the baked CRD namespace, or the chart's
      # namespace guard aborts rendering during lint.
      - name: Lint Helm Chart
        run: |
          helm lint ./dist/chart --namespace ${NAMESPACE}

      - name: Package Helm chart
        run: |
          helm package dist/chart --destination .

      - name: Upload chart artifact
        uses: actions/upload-artifact@v4
        with:
          name: helm-chart
          path: k0smotron-chart-${{ env.CHART_VERSION }}.tgz
          if-no-files-found: error
          retention-days: 1

  test-e2e:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    needs: package-chart
    env:
      NAMESPACE: k0smotron-system
      RELEASE: my-release
      IMG: k0smotron:v0.1.0
      CHART_TGZ: k0smotron-chart-0.0.0-test.tgz
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install the latest version of kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/latest/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Verify kind installation
        run: kind version

      - name: Create kind cluster
        run: kind create cluster

      - name: Prepare k0smotron
        run: |
          go mod tidy
          make docker-build IMG=${IMG}
          kind load docker-image ${IMG}

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Download packaged chart
        uses: actions/download-artifact@v4
        with:
          name: helm-chart

      # The chart's CRD conversion webhooks and admission webhooks need cert-manager.
      - name: Install cert-manager via Helm
        run: |
          helm repo add jetstack https://charts.jetstack.io
          helm repo update
          helm install cert-manager jetstack/cert-manager --namespace cert-manager --create-namespace --set crds.enabled=true

      - name: Wait for cert-manager to be ready
        run: |
          kubectl wait --namespace cert-manager --for=condition=available --timeout=300s deployment/cert-manager
          kubectl wait --namespace cert-manager --for=condition=available --timeout=300s deployment/cert-manager-cainjector
          kubectl wait --namespace cert-manager --for=condition=available --timeout=300s deployment/cert-manager-webhook

      - name: Install Helm chart for project
        run: |
          helm install ${RELEASE} ./${CHART_TGZ} --create-namespace --namespace ${NAMESPACE} --wait --timeout 5m

      - name: Check Helm release status
        run: |
          helm status ${RELEASE} --namespace ${NAMESPACE}
          kubectl wait --namespace ${NAMESPACE} --for=condition=available --timeout=300s deployment --all

      - name: Assert manager is rolled out and stable
        run: |
          set -euo pipefail
          kubectl rollout status deploy/k0smotron-controller-manager -n ${NAMESPACE} --timeout=300s
          # Pod must be Ready...
          kubectl wait --namespace ${NAMESPACE} \
            --for=condition=Ready pod \
            -l control-plane=controller-manager --timeout=120s
          # ...and not crash-looping.
          restarts=$(kubectl get pods -n ${NAMESPACE} -l control-plane=controller-manager \
            -o jsonpath='{range .items[*]}{range .status.containerStatuses[*]}{.restartCount}{"\n"}{end}{end}')
          echo "container restart counts:"
          echo "${restarts}"
          total=$(echo "${restarts}" | awk '{s += $1} END {print s + 0}')
          if [ "${total}" -ne 0 ]; then
            echo "::error::manager containers restarted ${total} time(s) (possible crashloop)"
            exit 1
          fi

      - name: Assert services exist
        run: |
          set -euo pipefail
          kubectl get svc k0smotron-webhook-service -n ${NAMESPACE}
          kubectl get svc k0smotron-controller-manager-metrics-service -n ${NAMESPACE}

      - name: Dump diagnostics on failure
        if: failure()
        run: |
          echo "===== pods ====="
          kubectl get pods -A -o wide || true
          echo "===== manager describe ====="
          kubectl describe pods -n ${NAMESPACE} -l control-plane=controller-manager || true
          echo "===== manager logs ====="
          kubectl logs -n ${NAMESPACE} -l control-plane=controller-manager --all-containers --tail=200 || true
          echo "===== events ====="
          kubectl get events -n ${NAMESPACE} --sort-by=.lastTimestamp || true
