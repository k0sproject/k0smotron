name: Nightly E2E Tests

on:
  workflow_dispatch:
    inputs:
      pr:
        description: >-
          Pull request number to test (works for PRs opened from forks).
          The code under test is the PR merge commit, but the workflow itself,
          the runners and the secrets come from this repository.
          SECURITY: only dispatch this for PRs whose diff you have reviewed,
          the PR code runs with this repository's AWS role and SSH secrets.
          Leave empty to test the branch selected above.
        required: false
        type: string
      test-name:
        description: >-
          Single Go test name (or regex) to run, e.g. TestWindowsProvisioning.
          Leave empty to run the full nightly suite list.
        required: false
        type: string
  schedule:
    - cron: '0 2 * * *'  # Runs every day at 02:00 UTC

permissions:
  id-token: write   # This is required for requesting the JWT
  contents: read    # This is required for actions/checkout

concurrency:
  group: e2e-nightly-${{ inputs.pr || github.ref }}
  cancel-in-progress: false

env:
  # Ref holding the code under test: the PR merge commit when a PR number was
  # given, otherwise the ref the workflow was triggered on.
  TEST_REF: ${{ inputs.pr && format('refs/pull/{0}/merge', inputs.pr) || github.ref }}

jobs:
  # check-main-changes check if the development version has changed in the last 24 hours. If not, the nightly tests are skipped meaning that
  # the nightly e2e tests have already been run for the current development version.
  # On manual runs the check is skipped and the requested suites are resolved.
  check-main-changes:
    name: Check for changes on main
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      suites: ${{ steps.suites.outputs.suites }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check commits in last 24h
        id: check
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Manual run, skipping the 24h change check."
            exit 0
          fi

          git fetch origin main

          if git log origin/main --since="24 hours ago" --oneline | grep .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Changes detected in the last 24 hours on main branch."
            exit 0
          fi

          last_conclusion=$(gh run list \
            --workflow "${{ github.workflow }}" \
            --branch main \
            --status completed \
            --limit 1 \
            --json conclusion \
            --jq '.[0].conclusion')
          
          if [ "$last_conclusion" != "success" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Last nightly run did not succeed. Running tests again."
            exit 0
          fi

          echo "changed=false" >> "$GITHUB_OUTPUT"
          echo "No changes detected in the last 24 hours on main branch and last nightly run succeeded. Skipping tests."

      - name: Resolve e2e suites
        id: suites
        env:
          TEST_NAME: ${{ inputs.test-name }}
        run: |
          if [ -n "$TEST_NAME" ]; then
            suites="$(jq -cn --arg t "$TEST_NAME" '[$t]')"
          else
            suites='["TestIgnitionProvisioning","TestWindowsProvisioning"]'
          fi
          echo "suites=$suites" >> "$GITHUB_OUTPUT"
          echo "Suites to run: $suites"
          echo "Code under test: $TEST_REF"

  build:
    name: Build artifacts
    needs: check-main-changes
    if: needs.check-main-changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TEST_REF }}
          fetch-depth: 0 # for `git describe`
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: go.mod

      - name: Build
        run: |
          make build

      - name: Upload manager binary
        uses: actions/upload-artifact@v4
        with:
          name: manager-binary
          path: bin/manager

      - name: Build image bundle
        run: |
          # Build Docker image and create image bundle
          make k0smotron-image-bundle.tar

      - name: Upload image bundle
        uses: actions/upload-artifact@v4
        with:
          name: k0smotron-image-bundle
          path: k0smotron-image-bundle.tar

      - name: Build cluster api components
        run: |
          make bootstrap-components.yaml control-plane-components.yaml infrastructure-components.yaml
          mkdir -p v0.0.0 k0sproject-k0smotron/control-plane-k0sproject-k0smotron/ k0sproject-k0smotron/bootstrap-k0sproject-k0smotron/ k0sproject-k0smotron/infrastructure-k0sproject-k0smotron/

          mv bootstrap-components.yaml v0.0.0
          mv control-plane-components.yaml v0.0.0
          mv infrastructure-components.yaml v0.0.0
          mv ./hack/capi-ci/metadata.yaml v0.0.0

          cp -r v0.0.0 k0sproject-k0smotron/bootstrap-k0sproject-k0smotron/
          cp -r v0.0.0 k0sproject-k0smotron/control-plane-k0sproject-k0smotron/
          cp -r v0.0.0 k0sproject-k0smotron/infrastructure-k0sproject-k0smotron/

      - name: Upload cluster api components
        uses: actions/upload-artifact@v4
        with:
          name: cluster-api-components
          path: |
            config.yaml
            k0sproject-k0smotron/

      - name: Generate install yaml
        run: |
          make release

      - name: Upload install yaml
        uses: actions/upload-artifact@v4
        with:
          name: install-yaml
          path: install.yaml

  publish-ttl:
    name: Publish to ttl.sh (best effort)
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Download image bundle
        uses: actions/download-artifact@v4
        with:
          name: k0smotron-image-bundle

      - name: Load and publish image
        run: |
          docker load -i k0smotron-image-bundle.tar
          docker tag quay.io/k0sproject/k0smotron:latest ttl.sh/k0smotron-${{ github.sha }}:24h
          docker push ttl.sh/k0smotron-${{ github.sha }}:24h
          echo "Docker image: ttl.sh/k0smotron-${{ github.sha }}:24h" >>$GITHUB_STEP_SUMMARY

  e2e:
    name: E2E test
    needs: [check-main-changes, build]
    runs-on: oracle-vm-16cpu-64gb-x86-64
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        e2e-suite: ${{ fromJSON(needs.check-main-changes.outputs.suites) }}
    env:
      SSH_KEY_NAME: ${{ secrets.SSH_KEY_NAME }}
      SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}

    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TEST_REF }}

      - name: Set up Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: go.mod

      - name: Download image bundle
        uses: actions/download-artifact@v5
        with:
          name: k0smotron-image-bundle

      - name: Load k0smotron image bundle
        run: |
          docker load -i k0smotron-image-bundle.tar

      - name: Download install manifest
        uses: actions/download-artifact@v5
        with:
          name: install-yaml

      - name: Download clusterawsadm
        uses: supplypike/setup-bin@v4
        with:
          name: clusterawsadm
          version: v2.9.2
          uri: https://github.com/kubernetes-sigs/cluster-api-provider-aws/releases/download/v2.9.2/clusterawsadm-linux-amd64

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: eu-west-1

      - name: Run e2e test
        env:
          TEST_NAME: ${{ matrix.e2e-suite }}
        run: |
          export AWS_B64ENCODED_CREDENTIALS=$(clusterawsadm bootstrap credentials encode-as-profile)
          make e2e TEST_NAME="$TEST_NAME" E2E_CONF_FILE="$(pwd)/e2e/config/aws.yaml"

      - name: Archive artifacts
        if: failure()
        uses: actions/upload-artifact@v4.3.2
        with:
          name: e2e-artifacts
          path: _artifacts
          if-no-files-found: ignore
